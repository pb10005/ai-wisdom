<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-label="表記が順序を求め、順序が意味を求めた" font-size="11" font-family="sans-serif">
<rect width="760" height="190" fill="#ffffff"/>
<defs><marker id="mech-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c9a92"/></marker></defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1d">表記が順序を求め、順序が意味を求めた</text>
<g fill="none" stroke="#9c9a92" stroke-width="1.25"><path d="M188 116H204" marker-end="url(#mech-arrow)"/><path d="M368 116H384" marker-end="url(#mech-arrow)"/><path d="M548 116H564" marker-end="url(#mech-arrow)"/></g>
<rect x="24" y="70" width="164" height="92" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
<text x="36" y="94" font-size="13" font-weight="600" fill="#1f1e1d">前提</text>
<text x="36" y="114" fill="#1f1e1d">演算は対称　3×4 = 4×3</text>
<text x="36" y="130" fill="#1f1e1d">場面は非対称</text>
<text x="36" y="146" fill="#6b6a66">3個/袋 と 4袋</text>
<rect x="204" y="70" width="164" height="92" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
<text x="216" y="94" font-size="13" font-weight="600" fill="#1f1e1d">中置記法</text>
<text x="216" y="114" fill="#1f1e1d">a×b は2つの数を</text>
<text x="216" y="130" fill="#1f1e1d">必ず左右に並べさせる</text>
<text x="216" y="146" fill="#6b6a66">位置に意味はない</text>
<rect x="384" y="70" width="164" height="92" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
<text x="396" y="94" font-size="13" font-weight="600" fill="#1f1e1d">誘導されたルール</text>
<text x="396" y="114" fill="#1f1e1d">順序を決めさせられる以上</text>
<text x="396" y="130" fill="#1f1e1d">人はそこに意味を求める</text>
<text x="396" y="146" fill="#1f1e1d">→「1つ分×いくつ分」</text>
<rect x="564" y="70" width="164" height="92" rx="8" fill="#3b6fd4" fill-opacity="0.12" stroke="#3b6fd4" stroke-width="2"/>
<text x="576" y="94" font-size="13" font-weight="600" fill="#1f1e1d">衝突</text>
<text x="576" y="114" fill="#1f1e1d">交換法則（数学）と</text>
<text x="576" y="130" fill="#1f1e1d">誘導されたルールが</text>
<text x="576" y="146" fill="#1f1e1d">同じ位置を奪い合う</text>
</svg>
