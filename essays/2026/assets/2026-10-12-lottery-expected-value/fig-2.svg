<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="300円の損と数億円の得は、同じ物差しで比べられない" font-size="13" font-family="sans-serif">
<rect width="760" height="320" fill="#ffffff"/>
<defs><marker id="util-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c9a92"/></marker></defs>
<text x="24" y="32" font-size="15" font-weight="600" fill="#1f1e1d">300円の損と数億円の得は、同じ物差しで比べられない</text>
<text x="24" y="52" font-size="11.5" fill="#6b6a66">金額と感じる価値の関係（概念図）</text>
<g fill="none" stroke="#9c9a92" stroke-width="1.25"><path d="M60 250H720" marker-end="url(#util-arrow)"/><path d="M200 268V70" marker-end="url(#util-arrow)"/></g>
<text x="44" y="254" text-anchor="middle" font-size="11.5" fill="#6b6a66">損</text>
<text x="738" y="254" text-anchor="middle" font-size="11.5" fill="#6b6a66">得</text>
<text x="210" y="78" font-size="11.5" fill="#6b6a66">感じる価値</text>
<line x1="80" y1="269.2" x2="700" y2="170" stroke="#9c9a92" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="240" y="196" font-size="11.5" fill="#6b6a66">期待値の計算の前提（1円の重みは常に同じ）</text>
<path d="M80 262 L200 250 C 380 244, 480 240, 530 222 C 560 200, 580 140, 610 120 C 640 108, 670 104, 700 102" fill="none" stroke="#3b6fd4" stroke-width="2"/>
<text x="700" y="88" text-anchor="end" font-size="11.5" font-weight="600" fill="#1f1e1d">実際に感じる価値</text>
<circle cx="170" cy="253" r="4" fill="#3b6fd4"/>
<text x="150" y="284" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f1e1d">300円の損</text>
<text x="150" y="300" text-anchor="middle" font-size="11.5" fill="#6b6a66">生活はほとんど変わらない</text>
<circle cx="610" cy="120" r="4" fill="#3b6fd4"/>
<text x="520" y="150" text-anchor="end" font-size="11.5" font-weight="600" fill="#1f1e1d">数億円の得</text>
<text x="520" y="168" text-anchor="end" font-size="11.5" fill="#6b6a66">住居・仕事・将来の選択肢が質的に変わる</text>
</svg>
