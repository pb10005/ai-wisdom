<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" role="img" aria-label="期待値は分布を1つの数字にまとめ、4つの情報を捨てている" font-size="13" font-family="sans-serif">
<rect width="760" height="376" fill="#ffffff"/>
<defs><marker id="sum-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c9a92"/></marker></defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1d">期待値は分布を1つの数字にまとめ、4つの情報を捨てている</text>
<rect x="24" y="64" width="232" height="72" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
<text x="140" y="94" text-anchor="middle" font-weight="600" fill="#1f1e1d">1枚の結果の分布</text>
<text x="140" y="116" text-anchor="middle" font-size="11.5" fill="#6b6a66">はずれ・少額当せん・高額当せん</text>
<rect x="504" y="64" width="232" height="72" rx="8" fill="#3b6fd4" fill-opacity="0.12" stroke="#3b6fd4" stroke-width="2"/>
<text x="620" y="94" text-anchor="middle" font-weight="600" fill="#1f1e1d">期待値</text>
<text x="620" y="116" text-anchor="middle" font-size="11.5" fill="#1f1e1d">約−160円という1つの数字</text>
<g fill="none" stroke="#9c9a92" stroke-width="1.25"><path d="M256 100H502" marker-end="url(#sum-arrow)"/><path d="M380 100V166" marker-end="url(#sum-arrow)"/></g>
<text x="318" y="90" text-anchor="middle" font-size="11.5" fill="#6b6a66">要約する</text>
<text x="390" y="140" font-size="11.5" fill="#6b6a66">そのとき捨てる</text>
<rect x="24" y="168" width="712" height="184" rx="8" fill="#f3f1ec" stroke="#9c9a92" stroke-width="1.25"/>
<text x="40" y="194" font-weight="600" fill="#1f1e1d">要約で捨てられたものと、無視したときの誤り</text>
<rect x="40" y="208" width="332" height="56" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
<text x="56" y="232" font-weight="600" fill="#1f1e1d">試行回数</text>
<text x="56" y="250" font-size="11.5" fill="#6b6a66">1回きりの結果が平均の近くに来ると思い込む</text>
<rect x="388" y="208" width="332" height="56" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
<text x="404" y="232" font-weight="600" fill="#1f1e1d">分布の形（歪み）</text>
<text x="404" y="250" font-size="11.5" fill="#6b6a66">起こりえない中間値を「結果」と思い込む</text>
<rect x="40" y="280" width="332" height="56" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
<text x="56" y="304" font-weight="600" fill="#1f1e1d">金額から効用への変換</text>
<text x="56" y="322" font-size="11.5" fill="#6b6a66">300円の損と数億円の得を同じ物差しで比べる</text>
<rect x="388" y="280" width="332" height="56" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
<text x="404" y="304" font-weight="600" fill="#1f1e1d">金銭以外の収支</text>
<text x="404" y="322" font-size="11.5" fill="#6b6a66">娯楽や体験の価値をゼロとみなす</text>
</svg>
