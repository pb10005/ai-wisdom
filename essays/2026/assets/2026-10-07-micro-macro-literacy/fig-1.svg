<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="アンチパターンの多くは規模と抽象度の取り違えから生じる" font-size="13" font-family="sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <defs><marker id="ap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c9a92"/></marker></defs>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1d">アンチパターンの多くは、規模と抽象度の取り違えから生じる</text>
  <text x="24" y="72" font-size="11.5" fill="#6b6a66">規模の軸</text>
  <rect x="24" y="84" width="200" height="80" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
  <text x="124" y="118" text-anchor="middle" font-weight="600" fill="#1f1e1d">個人（ミクロ）</text>
  <text x="124" y="142" text-anchor="middle" font-size="11.5" fill="#6b6a66">一人・一部署</text>
  <rect x="536" y="84" width="200" height="80" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
  <text x="636" y="118" text-anchor="middle" font-weight="600" fill="#1f1e1d">全体（マクロ）</text>
  <text x="636" y="142" text-anchor="middle" font-size="11.5" fill="#6b6a66">国・社会・会社全体</text>
  <g fill="none" stroke="#9c9a92" stroke-width="1.25"><path d="M228 112H532" marker-end="url(#ap-arrow)"/><path d="M532 136H228" marker-end="url(#ap-arrow)"/></g>
  <text x="380" y="102" text-anchor="middle" font-size="11.5" fill="#1f1e1d">A 個人の視点で全体の問題を測る</text>
  <text x="380" y="156" text-anchor="middle" font-size="11.5" fill="#1f1e1d">B 全体の論理で個人を扱う</text>
  <text x="24" y="200" font-size="11.5" fill="#6b6a66">抽象度の軸</text>
  <rect x="24" y="212" width="200" height="80" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
  <text x="124" y="246" text-anchor="middle" font-weight="600" fill="#1f1e1d">個別の事例</text>
  <text x="124" y="270" text-anchor="middle" font-size="11.5" fill="#6b6a66">この現場・この人</text>
  <rect x="536" y="212" width="200" height="80" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
  <text x="636" y="246" text-anchor="middle" font-weight="600" fill="#1f1e1d">一般論</text>
  <text x="636" y="270" text-anchor="middle" font-size="11.5" fill="#6b6a66">定石・ベストプラクティス</text>
  <g fill="none" stroke="#9c9a92" stroke-width="1.25"><path d="M228 240H532" marker-end="url(#ap-arrow)"/><path d="M532 264H228" marker-end="url(#ap-arrow)"/></g>
  <text x="380" y="230" text-anchor="middle" font-size="11.5" fill="#1f1e1d">C 一つの成功例を一般化する</text>
  <text x="380" y="284" text-anchor="middle" font-size="11.5" fill="#1f1e1d">C 一般論をそのまま当てはめる</text>
  <rect x="24" y="316" width="712" height="60" rx="8" fill="#f3f1ec" stroke="#9c9a92" stroke-width="1.25"/>
  <text x="380" y="341" text-anchor="middle" font-weight="600" fill="#1f1e1d">D 反対方向への行き過ぎ</text>
  <text x="380" y="363" text-anchor="middle" font-size="11.5" fill="#6b6a66">何でも構造のせいにする／「うちは特殊だから」と学ばない</text>
</svg>
