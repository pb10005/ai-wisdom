<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="応急処置で止めても、原因を確かめるまでは終わらない" font-size="13" font-family="sans-serif">
<rect width="760" height="290" fill="#ffffff"/>
<defs><marker id="aid-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9c9a92"/></marker></defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1d">応急処置で止めても、原因を確かめるまでは終わらない</text>
<g fill="none" stroke="#9c9a92" stroke-width="1.25"><path d="M104 150V110H208" marker-end="url(#aid-arrow)"/><path d="M104 198V238H208" marker-end="url(#aid-arrow)"/><path d="M368 238H392" marker-end="url(#aid-arrow)"/><path d="M552 238H576" marker-end="url(#aid-arrow)"/><path d="M288 146V210" stroke-dasharray="4 4" marker-end="url(#aid-arrow)"/></g>
<text x="300" y="182" font-size="11.5" fill="#6b6a66">止めたら次は把握へ</text>
<rect x="24" y="150" width="160" height="48" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
<text x="104" y="178" text-anchor="middle" font-weight="600" fill="#1f1e1d">問題発生</text>
<rect x="208" y="74" width="160" height="72" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
<text x="288" y="98" text-anchor="middle" font-weight="600" fill="#1f1e1d">応急処置</text>
<text x="288" y="114" text-anchor="middle" font-size="11.5" fill="#6b6a66">被害の拡大を止める</text>
<text x="288" y="130" text-anchor="middle" font-size="11.5" fill="#6b6a66">並行して、または先に</text>
<text x="392" y="114" font-size="11.5" fill="#6b6a66">応急処置だけでは問題は終わらない</text>
<rect x="208" y="210" width="160" height="56" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
<text x="288" y="234" text-anchor="middle" font-weight="600" fill="#1f1e1d">問題の把握</text>
<text x="288" y="250" text-anchor="middle" font-size="11.5" fill="#6b6a66">何が起きたのか</text>
<rect x="392" y="210" width="160" height="56" rx="8" fill="none" stroke="#9c9a92" stroke-width="1.25"/>
<text x="472" y="234" text-anchor="middle" font-weight="600" fill="#1f1e1d">原因の特定</text>
<text x="472" y="250" text-anchor="middle" font-size="11.5" fill="#6b6a66">なぜ起きたのか</text>
<rect x="576" y="210" width="160" height="56" rx="8" fill="#3b6fd4" fill-opacity="0.12" stroke="#3b6fd4" stroke-width="2"/>
<text x="656" y="234" text-anchor="middle" font-weight="600" fill="#1f1e1d">根本対策</text>
<text x="656" y="250" text-anchor="middle" font-size="11.5" fill="#1f1e1d">問題を本当に終わらせる</text>
</svg>
